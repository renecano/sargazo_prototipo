name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      # Los datos de SEMAR no están en git: las pruebas usan fixtures en el formato real
      # (scripts/generar_fixtures.py) y las de datos reales se omiten.
      - name: Pruebas rápidas (lector, validador, modelo, API)
        run: python -m pytest

  interfaz:
    name: Prueba de interfaz de punta a punta (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias y Chromium
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Pruebas e2e
        run: python -m pytest -m e2e
